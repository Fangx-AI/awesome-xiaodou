name: Skill 发布校验
on:
  push:
    branches: [main]
    paths-ignore: [data/radar.json, docs/radar.md]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild and check
        run: |
          python -B scripts/test_pilot_measure.py
          python -B scripts/test_capture_github_metrics.py
          python -B scripts/test_verify_candidate.py
          python -B scripts/test_build_catalog.py
          python scripts/build_catalog.py
          python scripts/build_skill.py "$RUNNER_TEMP/xiaodou"
          python scripts/check_release.py "$RUNNER_TEMP/xiaodou/xiaodou-skill.zip"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Test the packed divination tools
        run: |
          python -m zipfile -e "$RUNNER_TEMP/xiaodou/xiaodou-skill.zip" "$RUNNER_TEMP/xiaodou/extracted"
          skill="$RUNNER_TEMP/xiaodou/extracted/xiaodou-skill"
          for suite in "$skill"/vendor/ziwei-bazi/tests/test_*.py; do
            python -B "$suite"
          done
          node "$skill/scripts/birth-chart/fortune.cjs" 2 > "$RUNNER_TEMP/xiaodou/lot.json"
          python -c 'import json, sys; lot = json.load(open(sys.argv[1], encoding="utf-8")); assert lot["number"] == 2 and len(lot["verse"]) == 4' "$RUNNER_TEMP/xiaodou/lot.json"
          charts="$skill/scripts/birth-chart"
          npm ci --prefix "$charts" --ignore-scripts --no-audit --no-fund
          node scripts/check_packed_charts.cjs "$charts"
      - name: Prepare checksums and source links for the S0 candidate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/s0-pilot'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          public_readme_commit=$(git rev-parse FETCH_HEAD)
          base_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob"
          starter_versions="$RUNNER_TEMP/xiaodou/STARTERS.tsv"
          printf 'file\tcandidate_url\tpublic_url\tpublic_status\n' > "$starter_versions"
          for source in prompts/xiaodou-start.txt prompts/xiaodou-life-plans.txt prompts/life-plans/*.txt; do
            public_url=''
            public_status=missing
            if git cat-file -e "$public_readme_commit:$source"; then
              public_url="$base_url/$public_readme_commit/$source"
              git show "$public_readme_commit:$source" > "$RUNNER_TEMP/xiaodou-public-starter.txt"
              public_status=different
              if cmp -s "$RUNNER_TEMP/xiaodou-public-starter.txt" "$source"; then
                public_status=identical
              fi
            fi
            printf '%s\t%s\t%s\t%s\n' "${source#prompts/}" "$base_url/$GITHUB_SHA/$source" "$public_url" "$public_status" >> "$starter_versions"
            if [ "$source" = prompts/xiaodou-start.txt ]; then
              public_starter_matches_candidate=false
              if [ "$public_status" = identical ]; then
                public_starter_matches_candidate=true
              fi
            fi
          done
          cp prompts/xiaodou-start.txt prompts/xiaodou-pilot-start.txt prompts/xiaodou-life-plans.txt "$RUNNER_TEMP/xiaodou/"
          cp -r prompts/life-plans "$RUNNER_TEMP/xiaodou/"
          cd "$RUNNER_TEMP/xiaodou"
          {
            printf 'candidate_commit=%s\n' "$GITHUB_SHA"
            printf 'readme=%s/%s/blob/%s/README.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'public_readme_commit=%s\n' "$public_readme_commit"
            printf 'public_readme=%s/%s/blob/%s/README.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$public_readme_commit"
            printf 'public_starter_matches_candidate=%s\n' "$public_starter_matches_candidate"
            printf 'starter_versions=STARTERS.tsv\n'
            printf 'scene_starters=true\n'
            printf 'plan_starters=true\n'
            printf 'pilot=%s/%s/blob/%s/docs/field-tests/pilot-s0.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'seven_day=%s/%s/blob/%s/docs/field-tests/seven-day.md\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > CANDIDATE.txt
          sha256sum xiaodou-skill.zip xiaodou-start.txt xiaodou-pilot-start.txt xiaodou-life-plans.txt life-plans/*.txt STARTERS.tsv CANDIDATE.txt > SHA256SUMS
          python -B "$GITHUB_WORKSPACE/scripts/verify_candidate.py" . --commit "$GITHUB_SHA" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Upload checked S0 candidate
        id: candidate_artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/s0-pilot'
        uses: actions/upload-artifact@v7
        with:
          name: xiaodou-s0-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xiaodou/xiaodou-skill.zip
            ${{ runner.temp }}/xiaodou/xiaodou-start.txt
            ${{ runner.temp }}/xiaodou/xiaodou-pilot-start.txt
            ${{ runner.temp }}/xiaodou/xiaodou-life-plans.txt
            ${{ runner.temp }}/xiaodou/life-plans/*.txt
            ${{ runner.temp }}/xiaodou/SHA256SUMS
            ${{ runner.temp }}/xiaodou/CANDIDATE.txt
            ${{ runner.temp }}/xiaodou/STARTERS.tsv
          if-no-files-found: error
      - name: Show candidate download and trial links
        if: steps.candidate_artifact.outputs.artifact-id != ''
        env:
          ARTIFACT_URL: ${{ steps.candidate_artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: |
          cd "$RUNNER_TEMP/xiaodou"
          public_readme=$(sed -n 's/^public_readme=//p' CANDIDATE.txt)
          pilot=$(sed -n 's/^pilot=//p' CANDIDATE.txt)
          seven_day=$(sed -n 's/^seven_day=//p' CANDIDATE.txt)
          matching=$(awk -F '\t' '$4 == "identical" { total++ } END { print total + 0 }' STARTERS.tsv)
          total=$(awk 'END { print NR - 1 }' STARTERS.tsv)
          {
            printf '## 小豆候选包\n\n'
            printf '[登录 GitHub 后下载本次候选包](%s)\n\n' "$ARTIFACT_URL"
            printf '候选提交 `%s`\n\n' "$GITHUB_SHA"
            printf '[首页冷读固定页](%s) · [七天自选任务](%s) · [真机演练](%s)\n\n' \
              "$public_readme" "$seven_day" "$pilot"
            printf '与公开首页固定版本一致的开局文件为 %s/%s 份。各文件请看包内 `STARTERS.tsv`。\n\n' \
              "$matching" "$total"
            printf 'GitHub 工件 SHA-256 `%s`\n\n' "$ARTIFACT_DIGEST"
            printf '在仓库根目录下载并核对文件。\n\n'
            printf '```bash\n'
            printf 'gh run download %s --repo %s --name xiaodou-s0-%s --dir xiaodou-s0-%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'python scripts/verify_candidate.py xiaodou-s0-%s --commit %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
