name: Skill 发布校验
on:
  push:
    branches: [main]
    paths-ignore: [data/radar.json, docs/radar.md]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild and check
        run: |
          python scripts/build_catalog.py
          python scripts/build_skill.py "$RUNNER_TEMP/xiaodou"
          python scripts/check_release.py "$RUNNER_TEMP/xiaodou/xiaodou-skill.zip"
          git diff --exit-code
          test -z "$(git status --porcelain)"
