name: 小豆玩法雷达
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/radar.yml
      - scripts/collect_radar.py
permissions:
  contents: write
concurrency:
  group: xiaodou-radar
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'Fangx-AI/awesome-xiaodou' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Collect public feed leads
        run: python3 scripts/collect_radar.py
      - name: Publish updated radar
        run: |
          git add data/radar.json docs/radar.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '更新小豆玩法雷达'
          git pull --rebase origin main
          git push origin HEAD:main
