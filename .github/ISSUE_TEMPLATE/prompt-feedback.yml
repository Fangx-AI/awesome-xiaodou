name: 提示词试用反馈
description: 分享你在小豆实际试了什么，以及结果如何
title: "[提示词反馈] "
body:
  - type: input
    id: prompt
    attributes:
      label: 提示词名称或链接
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: 结果
      options:
        - 可以直接用
        - 修改后可用
        - 没得到想要的结果
        - 连接或权限受限
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 你给的输入和小豆的结果
      description: 请先隐去私人地址、联系方式和聊天内容中的身份信息。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 小豆版本、设备或日期
