name: 七天试用登记
description: 已在小豆开局后自愿登记，可以同时回报第一步或遇到的阻碍
title: "[七天试用] "
labels: [seven-day-trial]
body:
  - type: markdown
    attributes:
      value: |
        这个表单会公开显示你的 GitHub 账号。只写能公开的类别和结果，省略真实姓名、体重、病史、学校、单位、邀请码和对话截图。由观察者带领试用时，也可以直接向观察者回报。
  - type: checkboxes
    id: started
    attributes:
      label: 我已开始试用
      options:
        - label: 我已在小豆独立 App 发出开局消息
          required: true
  - type: input
    id: started-on
    attributes:
      label: 开局日期
      description: 填你在小豆实际发出开局消息的日期。
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 手机系统和小豆 App 版本
      description: 手边找得到再填，例如「iOS，小豆 15.9.0」。
  - type: dropdown
    id: goal
    attributes:
      label: 你的目标属于哪一类
      options:
        - 健康与运动
        - 学习与成长
        - 职业与工作
        - 财务与生活事务
        - 习惯、关系与复盘
        - 其他
  - type: input
    id: candidate
    attributes:
      label: 使用的开局链接
      description: 有开局链接就贴链接，只记得开局名称也可以填。
  - type: input
    id: channel
    attributes:
      label: 最早在哪里看到试用
      placeholder: 例如 GitHub 首页、朋友、社区，或留空
  - type: dropdown
    id: shared-scene
    attributes:
      label: 是哪张分享卡让你想试
      description: 如果从分享卡了解到这个项目，可以选一张。其他情况留空。
      options:
        - 制定减肥计划
        - 健身
        - 自律阅读
        - 学英语
        - 留学
  - type: textarea
    id: first-update
    attributes:
      label: 第一步做到哪了
      description: 已有进展就现在填。写明第一步、实际完成日期或卡点。改过计划时也可以说什么变了、保留什么、下一步是什么。
      placeholder: |
        第一步是练一遍开场。我在 2026-11-24 练完了。
        周四没空，小豆保留了这一遍，把下次练习挪到周六。
  - type: markdown
    attributes:
      value: |
        发帖后可以收藏链接。做完或想补充时直接回原帖，到第七天仍未完成也欢迎说说卡在哪里。
