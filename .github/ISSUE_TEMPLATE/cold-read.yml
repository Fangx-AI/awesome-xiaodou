name: 第一次看首页
description: 用两句话说说你刚才怎么理解、实际点了哪里
title: "第一次看小豆皇帝模拟器首页"
labels: [cold-read]
body:
  - type: markdown
    attributes:
      value: |
        按第一次看到时的理解来答。找到了、点错了、中途停下了，都可以写。留言会公开显示你的 GitHub 账号。请省略个人资料和截图。
  - type: textarea
    id: first-impression
    attributes:
      label: 你第一次看到时怎么理解
      description: 用自己的话说说它是什么、在哪里用。如果要发消息或设置提醒，你觉得会怎么发生？
    validations:
      required: true
  - type: textarea
    id: find-start
    attributes:
      label: 你当时想点哪里，实际点了哪里
      description: 写下你点过的文字和接下来看到什么。中途停下的话，告诉我们停在哪。
    validations:
      required: true
  - type: input
    id: readme-version
    attributes:
      label: 你打开的首页链接
      placeholder: 公开首页或观察者给的固定链接
  - type: input
    id: reading-device
    attributes:
      label: 用什么设备看的
      placeholder: 例如 iPhone 浏览器、安卓浏览器或电脑上的 Chrome
