name: 首页可读性反馈
description: 第一次打开项目首页时，记下最先想点的位置和看不懂的地方
title: "[S0 冷读] "
labels: [cold-read]
body:
  - type: markdown
    attributes:
      value: |
        请先读完首页再填，按你最初的理解来答。这份反馈会公开显示你的 GitHub 账号。请省略个人资料和截图。
  - type: textarea
    id: first-impression
    attributes:
      label: 第一次看完，你怎么理解
      description: 用自己的话说说它是什么、在哪里用。如果要发消息或设置提醒，你觉得会怎么发生？
    validations:
      required: true
  - type: textarea
    id: find-start
    attributes:
      label: 你会点哪里开始
      description: 写下最先想点的文字、实际点到哪里，以及哪里卡住。找不到入口也可以写。
    validations:
      required: true
  - type: input
    id: readme-version
    attributes:
      label: 你打开的首页链接
      placeholder: 公开首页或观察者给的固定链接
  - type: input
    id: reading-device
    attributes:
      label: 用什么设备看的
      placeholder: 例如 iPhone 浏览器、安卓浏览器或电脑上的 Chrome
