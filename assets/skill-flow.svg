<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="210" viewBox="0 0 1080 210" role="img" aria-labelledby="title">
  <title id="title">从一句话到一份计划：说出需求，匹配提示词，生成四周路线图</title>
  <rect width="1080" height="210" rx="26" fill="#fff3db"/>
  <g fill="#0c2340" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <text x="42" y="58" font-size="25" font-weight="700">说出需求</text>
    <text x="42" y="125" font-size="30">帮我做个减肥计划</text>
    <text x="393" y="58" font-size="25" font-weight="700">匹配提示词</text>
    <text x="393" y="125" font-size="30">先问作息和习惯</text>
    <text x="728" y="58" font-size="25" font-weight="700">给你可执行计划</text>
    <text x="728" y="125" font-size="30">四周计划＋每周复盘</text>
  </g>
  <g stroke="#ef6b17" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 106h40m-13-13 13 13-13 13"/>
    <path d="M650 106h40m-13-13 13 13-13 13"/>
    <path d="M42 164h125 M393 164h125 M728 164h125"/>
  </g>
</svg>
